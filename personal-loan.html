
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Loan Application | Stanbic Bank Uganda</title>
    <link rel="stylesheet" href="dlac.css">
</head>

<body>

    <header>
        <h1>Stanbic Bank Uganda</h1>

        <nav>
            <a href="index.html">Loan Products</a>
            <a href="personal-loan.html">Apply for a Loan</a>
        </nav>
    </header>

    <main class="form-container">

        <h2>Personal Loan Application</h2>

        <form action="#" method="post">

            <div class="form-group">
                <label for="title">Title</label>
                <select id="title" name="title" required>
                    <option value="">Select Title</option>
                    <option>Mr</option>
                    <option>Mrs</option>
                    <option>Ms</option>
                    <option>Dr</option>
                </select>
            </div>

            <div class="form-group">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first-name" required>
            </div>

            <div class="form-group">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last-name" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="district">District</label>
                <select id="district" name="district" required>
                    <option value="">Select District</option>
                    <option>Kampala</option>
                    <option>Wakiso</option>
                    <option>Mukono</option>
                    <option>Jinja</option>
                    <option>Mbarara</option>
                </select>
            </div>

            <div class="form-group">
                <label for="salary">Monthly Salary (UGX)</label>
                <input type="number" id="salary" name="salary"
                       min="300000" required>
            </div>

            <p style="background:#EAF3DE; color:#27500A; padding:8px;">
                You appear eligible for this loan.
            </p>

            <div class="form-group">
                <label for="loan-amount">Loan Amount Requested (UGX)</label>
                <input type="number" id="loan-amount" name="loan-amount"
                       min="1" required>
            </div>

            <div class="form-group">
                <label for="period">Repayment Period</label>
                <select id="period" name="period" required>
                    <option value="">Select Period</option>
                    <option value="12">12 Months</option>
                    <option value="24">24 Months</option>
                    <option value="36">36 Months</option>
                </select>
            </div>

            <div class="form-group">
                <label for="purpose">Loan Purpose</label>
                <select id="purpose" name="purpose" required>
                    <option value="">Select Purpose</option>
                    <option>School Fees</option>
                    <option>Medical</option>
                    <option>Home Improvement</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="declaration">
                <input type="checkbox" id="declaration"
                       name="declaration" required>
                <label for="declaration">
                    I confirm that the information provided is accurate.
                </label>
            </div>

            <button type="submit">Submit Application</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Stanbic Bank Uganda. Academic demonstration project.</p>
    </footer>

</body>
</html>
